# Rate limiting configuration for Nginx
# Add this to your nginx.conf or server block

# Define rate limit zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=license_api:10m rate=5r/m;

# In your server block
server {
    listen 80;
    server_name your-domain.com;

    # Apply rate limiting to all requests
    limit_req zone=api burst=20 nodelay;

    # Specific rate limiting for license API
    location /license_api {
        limit_req zone=license_api burst=5 nodelay;
        proxy_pass http://localhost:5800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other locations can use the general rate limit
    location / {
        proxy_pass http://localhost:5800;
        # ... other proxy settings
    }
}