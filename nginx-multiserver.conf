# -------------------------------------------------------
# 1. GLOBAL RATE LIMIT ZONES
# -------------------------------------------------------
# General limit: 10 requests/second (Good for normal website traffic)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

# License limit: 100 requests/minute (Strict for license checks)
limit_req_zone $binary_remote_addr zone=license_api:10m rate=100r/m;


# -------------------------------------------------------
# Server 1: API (License)
# -------------------------------------------------------
server {
  listen 80;
  server_name api.eaqdragon.com;

  location /license_api {
    # Apply the STRICT license limit here
    limit_req zone=license_api burst=5 nodelay;

    proxy_pass http://127.0.0.1:5800;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# -------------------------------------------------------
# Server 2: Main Site
# -------------------------------------------------------
server {
  listen 80;
  server_name eaqdragon.com www.eaqdragon.com;

  # Apply GENERAL limit to the whole server
  limit_req zone=general_limit burst=20 nodelay;

  location / {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

   location /api/topup {
        client_max_body_size 12M;
        proxy_pass http://127.0.0.1:3001;    # or your upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

